<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>タスク管理</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 0 20px; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .completed { text-decoration: line-through; color: #888; }
        .inline-form { display: inline; }
    </style>
</head>
<body>
    <h1>タスク一覧</h1>

    <!-- 新規追加フォーム -->
    <form method="POST" action="">
        {% csrf_token %}
        <input type="text" name="title" placeholder="新しいタスクを入力..." required>
        <button type="submit">追加</button>
    </form>

    <!-- タスク一覧表示 -->
    <ul>
        {% for task in tasks %}
            <li>
                <span class="{% if task.completed %}completed{% endif %}">
                    {{ task.title }}
                </span>
                <div>
                    <!-- 完了/未完了 切り替え -->
                    <form method="POST" action="{% url 'toggle_task' task.pk %}" class="inline-form">
                        {% csrf_token %}
                        <button type="submit">
                            {% if task.completed %}未完了に戻す{% else %}完了{% endif %}
                        </button>
                    </form>
                    <!-- 削除ボタン -->
                    <form method="POST" action="{% url 'delete_task' task.pk %}" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" onclick="return confirm('削除しますか？')">削除</button>
                    </form>
                </div>
            </li>
        {% empty %}
            <li>タスクはありません。</li>
        {% endfor %}
    </ul>
</body>
</html>
